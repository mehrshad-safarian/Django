<!DOCTYPE html>
{% load static %}
<html lang="en" class="h-100">
<head>
    <meta charset="utf-8">
    <!-- Defines the character encoding to support all languages and symbols -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Makes the website responsive on all devices -->
    <meta name="description" content="Tehran Luxury Cars – Buy & Sell Premium and Luxury Cars in Tehran">
    <!-- Short description for SEO and search engine results -->
    <meta name="author" content="Tehran Luxury Cars">
    <!-- Specifies the website author or brand name -->
    <title>Tehran Luxury Cars</title>
    <!-- Sets the page title shown in the browser tab -->

    <!-- Bootstrap core css -->
    <link href = "{% static 'css/bootstrap.min.css' %}"  rel = "stylesheet" >

</head>

<body class="h-100 d-flex flex-column">
<!-- Full-height flex layout to keep footer at the bottom -->

    <main class="flex-shrink-0">
        <!-- Main content area that prevents shrinking in flex layout -->
        <h1>Welcome to {{ name }} </h1>
        <p>Tehran Luxury Cars – Premium & Exotic Vehicles Marketplace</p>
    </main>

    <footer class="footer mt-auto text-muted bg-dark py-5">
    <!-- Sticky footer with dark background and spacing -->
        <div class="container">
        <!-- Centers content and limits the maximum width -->
            <p class="float-end mb-1">
                Powered by <a href="https://www.djangoproject.com/" target="_blank">Django</a>
            </p>
            <p class="mb-1">
                Tehran Luxury Cars  Buy & Sell Luxury & Exotic Cars
            </p>
        </div>
    </footer>

</body>
</html>
