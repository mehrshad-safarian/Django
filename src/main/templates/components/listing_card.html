<div class="card shadow-sm h-100"> <!-- اضافه کردن h-100 برای ارتفاع یکسان -->
    <img class="bd-placeholder-img card-img-top" width="100%" height="200" src="{{listing.image.url}}" role="img" style="object-fit: cover;">
    
    <div class="card-body d-flex flex-column"> <!-- اضافه کردن d-flex flex-column -->
        <h4 class="card-text">{{listing.model}}</h4>
        
        <!-- اصلاح بخش فروشنده با استفاده از row -->
        <div class="row align-items-center mb-2">
            <div class="col-auto">
                <img src="{{listing.seller.photo.url}}" class="rounded-circle" height="30" width="30" style="object-fit: cover;">
            </div>
            <div class="col">
                <p class="card-text mb-0">{{listing.seller.user.username}}</p>
            </div>
        </div>

        <!-- محدود کردن توضیحات -->
        <p class="card-text flex-grow-1" style="
            display: -webkit-box;
            -webkit-line-clamp: 3; 
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;">
            {{listing.description}}
        </p>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <div class="btn-group">
                <a href="{% url 'listing' id=listing.id %}" class="btn btn-sm btn-outline-secondary">View</a>
                {% if listing.seller.user == request.user %}
                <a href="{% url 'edit' id=listing.id %}" class="btn btn-sm btn-outline-secondary">Edit</a>
                {% endif %}
            </div>
            <small class="text-muted">{{ listing.updated_at|date:"Y-m-d" }}</small>
            <button id="like-{{ listing.id }}" type="button" value="like" class="btn btn-secondary">
               {% if listing.id in liked_listings_ids %}
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="red" class="bi bi-heart"
                    viewBox="0 0 16 16">
                    <path
                        d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01L8 2.748zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143c.06.055.119.112.176.171a3.12 3.12 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15z">
                    </path>
                </svg>
                {% else %}
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="black" class="bi bi-heart"
                    viewBox="0 0 16 16">
                    <path
                        d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01L8 2.748zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143c.06.055.119.112.176.171a3.12 3.12 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15z">
                    </path>
                </svg>
                {% endif %}
            </button>
        </div>
    </div>
</div>

<script>
    $("#like-{{ listing.id }}").click(function(){
        $.ajax({
            type: "POST",
            url: "{% url 'like_listing' id=listing.id %}",
            data: { 'csrfmiddlewaretoken': '{{csrf_token}}' },
            dataType: "json",
            success: function(r){
                $("#like-{{listing.id}}").find("svg").attr("fill", r.is_liked_by_user ? "red" : "black");
            },
            error: function(rs, e){
                alert(e);
            }
        });
    })
</script>
